name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      app-name:
        required: false
        type: string
        default: "My App"
    secrets:
      MY_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: |
          echo "Building ${{ inputs.app-name }}"
          npm run build

      - name: Use secret
        run: echo "Token length is ${#MY_TOKEN}"
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}