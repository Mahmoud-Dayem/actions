name: output-from-step1
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
        version: ${{steps.step1.outputs.version}}


    steps:
      - name: build
        id: step1
        run: echo "version=0.0.1" >> $GITHUB_OUTPUT
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: deploy
 
        run: echo "we are deploy ${{ needs.build.outputs.version }}" 
 
     